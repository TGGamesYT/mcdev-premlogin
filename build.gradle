import java.lang.module.ModuleDescriptor

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.11.0'
}

group 'dev.tggamesyt'
version '1.11'

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()  // Required to resolve IntelliJ SDK + bundled plugins
        marketplace()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ===== IntelliJ Platform dependencies =====
dependencies {
    intellijPlatform {
        // Target IntelliJ IDEA version
        intellijIdea '2025.3.1.1'

        // Bundled plugins
        bundledPlugin 'com.intellij.java'

        // Minecraft Development plugin from Marketplace
        plugin 'com.demonwav.minecraft-dev', '2025.3-1.8.11'
    }

    // Your libraries
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.2'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
    implementation 'org.json:json:20230618'
    implementation 'com.google.zxing:core:3.5.3' // QR code generation for device-code login
    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}
tasks {
    patchPluginXml {
        changeNotes.set("1.11:<br>"
                + "- Your account now applies again on the newest Minecraft versions and the latest Minecraft Dev run configurations.<br>"
                + "- Better, more reliable detection of Minecraft Dev projects overall, including projects you open or clone without importing Gradle first.<br>"
                + "- You can now mark any project as a Minecraft project in settings, to show the account button even when it isn't auto-detected.<br>"
                + "- New --minecraftArgsHere placeholder: drop it into a run configuration or terminal command and it's automatically replaced with your login details when you run. It works in normal run configs out of the box, and can be enabled for Gradle run configs and the terminal from settings.")
    }

    buildPlugin {
        archiveBaseName.set("mcdev-premlogin")
        archiveVersion.set(version)
        destinationDirectory.set(file("$buildDir/distributions"))
    }
}
