import java.lang.module.ModuleDescriptor

plugins {
    id 'java'
    id 'org.jetbrains.intellij.platform' version '2.11.0'
}

group 'dev.tggamesyt'
version '1.11'

repositories {
    mavenCentral()

    intellijPlatform {
        defaultRepositories()  // Required to resolve IntelliJ SDK + bundled plugins
        marketplace()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

// ===== IntelliJ Platform dependencies =====
dependencies {
    intellijPlatform {
        // Target IntelliJ IDEA version
        intellijIdea '2025.3.1.1'

        // Bundled plugins
        bundledPlugin 'com.intellij.java'

        // Minecraft Development plugin from Marketplace
        plugin 'com.demonwav.minecraft-dev', '2025.3-1.8.11'
    }

    // Your libraries
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.2'
    implementation 'com.squareup.okhttp3:okhttp:5.0.0-alpha.11'
    implementation 'org.json:json:20230618'
    implementation 'com.google.zxing:core:3.5.3' // QR code generation for device-code login
    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.test {
    useJUnitPlatform()
}
tasks {
    patchPluginXml {
        changeNotes.set("1.11: Fixed the selected account not being applied on the newest Minecraft Dev + Minecraft versions, where the generated \"Minecraft Client\" run config is a Gradle run configuration (the login args are now passed to the Gradle runClient task via --args, in addition to the existing program-parameters path for Forge/NeoForge). Added project-import hooks: opening or cloning a Minecraft project without importing Gradle now triggers the Gradle link so Minecraft Dev detects it and the project is treated like a normal Minecraft Dev project. Added a \"Mark this project as a Minecraft project\" toggle in settings that shows the account head button even when no client run config is detected. Added a --minecraftArgsHere placeholder: put it in any run configuration field or command (e.g. --args=\"--minecraftArgsHere\" for a Gradle runClient task) and it is replaced at run time with the selected account's login args, without saving the token into the configuration. Java-based run configs work out of the box; an opt-in \"Gradle/terminal support\" toggle installs a global Gradle init script so the placeholder also works in Gradle run configs and the terminal.")
    }

    buildPlugin {
        archiveBaseName.set("mcdev-premlogin")
        archiveVersion.set(version)
        destinationDirectory.set(file("$buildDir/distributions"))
    }
}
